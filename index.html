<body>
  <!-- Statische Gegenstücke zu den JS-Formularen, damit Netlify sie beim
       Deploy erkennt. Formularnamen und Feldnamen müssen exakt mit den
       React-Formularen übereinstimmen (Booking.jsx, Kontakt.jsx), sonst
       verwirft Netlify die abweichenden Felder. -->
  <form name="terminanfrage" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="terminanfrage" />
    <input type="text" name="bot-field" />
    <input type="text" name="objektklasse" />
    <input type="text" name="zusatzleistung" />
    <input type="text" name="wunschtermin" />
    <input type="text" name="vorname" />
    <input type="text" name="nachname" />
    <input type="email" name="email" />
    <input type="tel" name="telefon" />
    <input type="text" name="firma" />
    <input type="text" name="adresse" />
    <input type="text" name="eigentuemer" />
    <textarea name="nachricht"></textarea>
    <textarea name="zusammenfassung"></textarea>
  </form>

  <form name="kontakt" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="kontakt" />
    <input type="text" name="bot-field" />
    <input type="text" name="anliegen" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="nachricht"></textarea>
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
